{% extends "catalogo/base.html" %}

{% block titulo %}Eliminar libro{% endblock %}

{% block contenido %}
<h1 class="mb-4">Eliminar libro</h1>

<div class="card p-4 col-lg-6">
    <p>¿Seguro que deseas eliminar <strong>{{ libro.titulo }}</strong> de {{ libro.autor }}?</p>
    <p class="text-muted">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{{ libro.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
