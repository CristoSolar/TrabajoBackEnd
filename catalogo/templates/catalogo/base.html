{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Biblioteca{% endblock %} · Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --tinta: #2b2118;
            --papel: #faf6ef;
            --crema: #f1e9dc;
            --oliva: #6b7f3f;
            --terracota: #b4552d;
            --dorado: #c9a227;
        }
        body {
            background-color: var(--papel);
            color: var(--tinta);
            font-family: "Inter", system-ui, sans-serif;
        }
        h1, h2, h3, .navbar-brand {
            font-family: "Fraunces", Georgia, serif;
        }
        .navbar {
            background-color: var(--tinta);
        }
        .navbar .navbar-brand, .navbar .nav-link {
            color: var(--papel);
        }
        .navbar .nav-link:hover {
            color: var(--dorado);
        }
        .card, .table {
            background-color: #fff;
            border-color: var(--crema);
        }
        .btn-primary {
            background-color: var(--oliva);
            border-color: var(--oliva);
        }
        .btn-primary:hover {
            background-color: #57682f;
            border-color: #57682f;
        }
        .btn-danger {
            background-color: var(--terracota);
            border-color: var(--terracota);
        }
        a {
            color: var(--oliva);
        }
        .badge-disponible { background-color: var(--oliva); }
        .badge-prestado { background-color: var(--dorado); color: var(--tinta); }
        .badge-baja { background-color: var(--terracota); }
    </style>
</head>
<body>
<nav class="navbar navbar-expand mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'catalogo:libro_lista' %}">📚 Biblioteca</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'catalogo:libro_lista' %}">Libros</a>
            <a class="nav-link" href="{% url 'catalogo:autor_lista' %}">Autores</a>
            <a class="nav-link" href="{% url 'catalogo:libro_crear' %}">Nuevo libro</a>
        </div>
    </div>
</nav>
<main class="container pb-5">
    {% if messages %}
        {% for mensaje in messages %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                {{ mensaje }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block contenido %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
